  <style id="nxbroker-common-layout-style">
      :root {
        --app-topbar-height: 72px;
        --app-tabbar-height: 59px;
        --app-sidebar-width: 278px;
        --app-sidebar-collapsed-width: 76px;
        --app-chrome-height: calc(var(--app-topbar-height) + var(--app-tabbar-height));
      }

      .sidebar,
      .app {
        transition:
          width 0.18s ease,
          margin-left 0.18s ease;
      }

      .app {
        width: auto;
        min-width: 0;
      }

      .app > .topbar,
      .app > .common-tabbar {
        min-width: 0;
      }

      .app > .topbar .search {
        min-width: 0;
      }

      .app > .topbar .search span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .top-actions,
      .toolbar-btn,
      .language {
        min-width: 0;
      }

      .sidebar-collapse-toggle {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        margin-left: auto;
        border: 1px solid var(--border-light);
        border-radius: 9px;
        background: #fff;
        color: #64748b;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
      }

      .sidebar-collapse-toggle:hover {
        color: #1d4ed8;
        border-color: #c7d7f7;
        background: #f8fbff;
      }

      .sidebar-collapse-toggle svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.2;
        transition: transform 0.18s ease;
      }

      .nav-label,
      .brand-copy,
      .logout-label,
      .portal-switch [data-portal-label],
      .portal-switch svg,
      .profile-name,
      .profile-email,
      .nav h2 {
        transition:
          opacity 0.14s ease,
          transform 0.14s ease;
      }

      .app > .topbar {
        position: sticky;
        top: 0;
        z-index: 18;
        backdrop-filter: blur(14px);
      }

      .app > .common-tabbar {
        position: sticky;
        top: var(--app-topbar-height);
        z-index: 17;
        backdrop-filter: blur(14px);
      }

      .mobile-nav-toggle,
      .mobile-nav-backdrop {
        display: none;
      }

      .active-menu {
        background: #eef4ff;
        color: #1d4ed8 !important;
        font-weight: 800;
      }

      .nav-item.has-children {
        position: relative;
      }

      .nav-item.has-children > a {
        position: relative;
        padding-right: 46px;
      }

      .nav-item.has-children > a::after {
        content: "";
        position: absolute;
        right: 28px;
        top: 50%;
        width: 7px;
        height: 7px;
        border-top: 1.8px solid currentColor;
        border-right: 1.8px solid currentColor;
        opacity: 0.45;
        transform: translateY(-50%) rotate(45deg);
      }

      .nav-item.has-children:hover > a::after,
      .nav-item.has-children:focus-within > a::after,
      .nav-item.has-children.is-flyout-open > a::after,
      .nav-item.has-children > a.active-menu::after {
        opacity: 0.9;
      }

      .nav-item.has-children:hover > a,
      .nav-item.has-children:focus-within > a,
      .nav-item.has-children.is-flyout-open > a {
        background: linear-gradient(90deg, #eef4ff 0%, rgba(238, 244, 255, 0.52) 100%);

      }

        z-index: 36;

        left: var(--nav-flyout-left, 277px);

        border-radius: 14px;

        pointer-events: none;
        transform: translateX(-4px) scale(0.98);
        transition:
          opacity 0.14s ease,
          transform 0.14s ease,
          visibility 0.14s ease;
        visibility: hidden;
      }

      .nav-item.has-children > .nav-submenu::before {
        content: "";

        bottom: -2px;
        left: -18px;
        width: 18px;
        background: transparent;

        pointer-events: auto;
        transform: translateX(0) scale(1);
        visibility: visible;

      }

      .nav-submenu .nav-flyout-icon {

        color: #2563eb;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .nav-submenu a {
        width: 100%;
        height: 38px;
        position: relative;
        justify-content: flex-start;
        gap: 0;
        margin: 0;
        padding: 0 12px 0 30px;
        border-radius: 8px;
        color: #66758a;
        font-size: 13px;
        font-weight: 850;
        line-height: 1;
        text-align: left;
        white-space: nowrap;
        transition:
          background 0.12s ease,
          color 0.12s ease,
          transform 0.12s ease;
      }

      .nav-submenu-title span,
      .nav-submenu a span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nav-submenu a::before {
        content: "";
        position: absolute;
        left: 14px;
        top: 50%;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #cbd5e1;
        transform: translateY(-50%);
      }

      .nav-submenu a:hover,
      .nav-submenu a.active-menu {
        background: #eef4ff;
        color: #1d4ed8;
      }

      .nav-submenu a:hover {
        transform: translateX(2px);
      }

      .nav-submenu a.active-menu::before {
        background: #2563eb;
      }

      .nav-submenu-item {
        position: relative;
      }

      .nav-submenu-item.has-children > a {
        padding-right: 32px;
      }

      .nav-submenu-item.has-children > a::after {
        content: "";

        width: 7px;
        height: 7px;
        border-top: 1.8px solid currentColor;
        border-right: 1.8px solid currentColor;
        opacity: 0.48;
        transform: translateY(-50%) rotate(45deg);
      }

      .nav-submenu .nav-subitem-icon {
        width: 20px;
        height: 20px;
        flex: 0 0 20px;
        margin-right: 8px;
        padding: 3px;
        border-radius: 7px;
        background: #eef4ff;
        color: #2563eb;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

        gap: 4px;
        margin: 0;

          #fff;
        box-shadow:

          0 2px 8px rgba(37, 99, 235, 0.06);

        pointer-events: none;
        transform: translateX(-4px) scale(0.98);
        transition:
          opacity 0.14s ease,
          transform 0.14s ease,
          visibility 0.14s ease;
        visibility: hidden;
      }
