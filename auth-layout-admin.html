<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./theme.js"></script>
    <title>ForexCRM - 登录注册 AI 生成</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./theme.css?v=tenant-home-4" />
    <link rel="stylesheet" href="./client-home.css?v=tenant-home-4" />
    <link rel="stylesheet" href="./home-personalization.css?v=tenant-home-5" />
    <link rel="stylesheet" href="./ai-model-settings.css?v=ai-model-settings-1" />
    <link rel="stylesheet" href="./auth-visual-training.css?v=auth-visual-training-3" />
  </head>
  <body data-layout-page="auth-layout-admin">
    <main class="app" data-layout-main>
      <div class="page personalization-page">
        <section class="ai-intake-shell ai-chat-intake" data-auth-intake-page>
          <div class="ai-chat-center">
            <header class="ai-chat-hero">
              <span>ForexCRM AI</span>
              <h1>定制你的登录注册模块</h1>
            </header>

            <div class="ai-generation-mode" role="tablist" aria-label="登录注册生成方式">
              <button class="active" type="button" role="tab" aria-selected="true" data-generation-mode-button="quick" data-auth-generation-mode-button="quick">AI 快速生成</button>
              <button type="button" role="tab" aria-selected="false" data-generation-mode-button="guided" data-auth-generation-mode-button="guided">引导式生成</button>
            </div>

            <div class="ai-generation-panel active" data-generation-panel="quick" data-auth-generation-panel="quick">
              <section class="ai-chat-composer" aria-label="AI 登录注册模块生成输入">
                <label class="visually-hidden" for="authAiPrompt">描述登录注册模块目标</label>
                <textarea
                  id="authAiPrompt"
                  data-auth-ai-prompt
                  rows="6"
                  placeholder="描述客户类型、登录方式、注册流程、移动端体验、Logo 摆放、安全级别、品牌感觉或活动目标..."
                >帮我生成一套适合外汇平台开户的登录注册模块：中文，移动端优先且必须美观，布局方案为左右布局，桌面端左侧品牌平台开户说明、右侧登录表单，移动端折叠为单列但保留 Logo、主入口和主按钮优先级。平台 Logo 摆放要有明确方案。登录首屏只保留账号（手机号/邮箱）和密码，可提供 Google / Apple 快捷登录；如账号开启双重验证，下一步输入 6 位验证码。注册和找回密码在提交、发送验证码等关键步骤触发人机校验，KYC 与风险确认放到注册后的开户流程说明里，整体可信但不要像通用模板。</textarea>

                <div class="ai-chat-toolbar">
                  <span class="ai-chat-status" data-auth-status>等待输入</span>
                  <div class="ai-chat-actions">
                    <button class="ai-tool-button" type="button" data-auth-reset aria-label="恢复默认认证模块" title="恢复默认认证模块">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7" /><path d="M4 4v6h6" /></svg>
                    </button>
                    <button class="ai-tool-button text" type="button" data-auth-model-open>
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" /><path d="M4 12h2" /><path d="M18 12h2" /><path d="m6.3 6.3 1.4 1.4" /><path d="m16.3 16.3 1.4 1.4" /><path d="M12 4v2" /><path d="M12 18v2" /><path d="m17.7 6.3-1.4 1.4" /><path d="m7.7 16.3-1.4 1.4" /></svg>
                      <span>模型</span>
                    </button>
                    <button class="ai-send-button" type="button" data-auth-generate aria-label="生成预览" title="生成预览">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5" /><path d="m5 12 7-7 7 7" /></svg>
                    </button>
                  </div>
                </div>
              </section>

              <section class="ai-chat-suggestions" aria-label="AI 推荐认证模块视觉方案" data-auth-suggestions>
                <div class="ai-suggestion-head">
                  <div>
                    <span>AI 视觉</span>
                    <strong data-auth-suggestion-note>推荐可直接套用的视觉方向</strong>
                  </div>
                  <div class="ai-suggestion-tools">
                    <button class="ai-suggestion-tool" type="button" data-auth-generate-suggestions>生成视觉方案</button>
                    <button class="ai-suggestion-tool" type="button" data-auth-refresh-suggestions>换一批</button>
                  </div>
                </div>
              </section>
            </div>

            <section class="ai-generation-panel guided-builder" data-generation-panel="guided" data-auth-generation-panel="guided" aria-label="引导式登录注册模块生成" hidden>
              <div class="guided-config">
                <section class="guided-section">
                  <div class="guided-section-head">
                    <span>功能分级</span>
                    <strong>控制认证流程复杂度</strong>
                  </div>
                  <div class="guided-options three" data-guided-group="registerDepth" data-auth-guided-group="registerDepth">
                    <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="registerDepth" data-auth-guided-group="registerDepth" data-guided-value="light" data-auth-guided-value="light" data-guided-label="基础版" data-auth-guided-label="基础版">基础版</button>
                    <button class="active" type="button" data-guided-choice data-auth-guided-choice data-guided-group="registerDepth" data-auth-guided-group="registerDepth" data-guided-value="standard" data-auth-guided-value="standard" data-guided-label="增长版" data-auth-guided-label="增长版">增长版</button>
                    <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="registerDepth" data-auth-guided-group="registerDepth" data-guided-value="compliance" data-auth-guided-value="compliance" data-guided-label="专业版" data-auth-guided-label="专业版">专业版</button>
                  </div>
                </section>

                <section class="guided-section">
                  <div class="guided-section-head">
                    <span>页面模块</span>
                  </div>
                  <div class="guided-module-block">
                    <div class="guided-module-label">
                      <span>必选模块</span>
                      <small>登录、注册、找回密码固定保留，不能撤销</small>
                    </div>
                    <div class="guided-options modules required" data-guided-group="flows" data-auth-guided-group="flows" data-guided-module-tier="required">
                      <button class="active" type="button" data-guided-choice data-auth-guided-choice data-guided-multiple data-auth-guided-multiple data-guided-required="true" data-auth-guided-required="true" data-guided-group="flows" data-auth-guided-group="flows" data-guided-value="login" data-auth-guided-value="login" data-guided-label="登录" data-auth-guided-label="登录" aria-disabled="true" title="必选模块，不可撤销">登录</button>
                      <button class="active" type="button" data-guided-choice data-auth-guided-choice data-guided-multiple data-auth-guided-multiple data-guided-required="true" data-auth-guided-required="true" data-guided-group="flows" data-auth-guided-group="flows" data-guided-value="register" data-auth-guided-value="register" data-guided-label="注册" data-auth-guided-label="注册" aria-disabled="true" title="必选模块，不可撤销">注册</button>
                      <button class="active" type="button" data-guided-choice data-auth-guided-choice data-guided-multiple data-auth-guided-multiple data-guided-required="true" data-auth-guided-required="true" data-guided-group="flows" data-auth-guided-group="flows" data-guided-value="forgot" data-auth-guided-value="forgot" data-guided-label="找回密码" data-auth-guided-label="找回密码" aria-disabled="true" title="必选模块，不可撤销">找回密码</button>
                    </div>
                  </div>
                  <div class="guided-module-block">
                    <div class="guided-module-label">
                      <span>选填模块</span>
                      <small>按业务需要加入字段、状态和安全提示</small>
                    </div>
                    <div class="guided-options modules optional" data-guided-group="features" data-auth-guided-group="features" data-guided-module-tier="optional">
                      <button class="active" type="button" data-guided-choice data-auth-guided-choice data-guided-multiple data-auth-guided-multiple data-guided-group="features" data-auth-guided-group="features" data-guided-value="phoneEmailLogin" data-auth-guided-value="phoneEmailLogin" data-guided-label="手机号 / 邮箱登录" data-auth-guided-label="手机号 / 邮箱登录">手机号 / 邮箱登录</button>
                      <button type="button" data-guided-choice data-auth-guided-choice data-guided-multiple data-auth-guided-multiple data-guided-group="features" data-auth-guided-group="features" data-guided-value="socialLogin" data-auth-guided-value="socialLogin" data-guided-label="第三方登录" data-auth-guided-label="第三方登录">第三方登录</button>
                      <button type="button" data-guided-choice data-auth-guided-choice data-guided-multiple data-auth-guided-multiple data-guided-group="features" data-auth-guided-group="features" data-guided-value="tradingAccountLogin" data-auth-guided-value="tradingAccountLogin" data-guided-label="交易账号登录" data-auth-guided-label="交易账号登录">交易账号登录</button>
                      <button class="active" type="button" data-guided-choice data-auth-guided-choice data-guided-multiple data-auth-guided-multiple data-guided-group="features" data-auth-guided-group="features" data-guided-value="captcha" data-auth-guided-value="captcha" data-guided-label="验证码 / Captcha" data-auth-guided-label="验证码 / Captcha">验证码</button>
                      <button class="active" type="button" data-guided-choice data-auth-guided-choice data-guided-multiple data-auth-guided-multiple data-guided-group="features" data-auth-guided-group="features" data-guided-value="twoFactor" data-auth-guided-value="twoFactor" data-guided-label="双重验证" data-auth-guided-label="双重验证">双重验证</button>
                      <button class="active" type="button" data-guided-choice data-auth-guided-choice data-guided-multiple data-auth-guided-multiple data-guided-group="features" data-auth-guided-group="features" data-guided-value="inviteCode" data-auth-guided-value="inviteCode" data-guided-label="推荐码 / 邀请码" data-auth-guided-label="推荐码 / 邀请码">推荐码</button>
                      <button type="button" data-guided-choice data-auth-guided-choice data-guided-multiple data-auth-guided-multiple data-guided-group="features" data-auth-guided-group="features" data-guided-value="kycPrelude" data-auth-guided-value="kycPrelude" data-guided-label="KYC 前置说明" data-auth-guided-label="KYC 前置说明">KYC 前置说明</button>
                      <button type="button" data-guided-choice data-auth-guided-choice data-guided-multiple data-auth-guided-multiple data-guided-group="features" data-auth-guided-group="features" data-guided-value="riskConsent" data-auth-guided-value="riskConsent" data-guided-label="风险披露确认" data-auth-guided-label="风险披露确认">风险披露确认</button>
                      <button type="button" data-guided-choice data-auth-guided-choice data-guided-multiple data-auth-guided-multiple data-guided-group="features" data-auth-guided-group="features" data-guided-value="promoReward" data-auth-guided-value="promoReward" data-guided-label="注册送礼 / 活动奖励" data-auth-guided-label="注册送礼 / 活动奖励">活动奖励</button>
                    </div>
                  </div>
                </section>

                <section class="guided-section guided-design-section">
                  <div class="guided-section-head">
                    <span>设计风格</span>
                    <strong>界面感觉</strong>
                  </div>
                  <div class="guided-options design-style" data-guided-group="designStyle" data-auth-guided-group="designStyle">
                    <button class="active" type="button" data-guided-choice data-auth-guided-choice data-guided-group="designStyle" data-auth-guided-group="designStyle" data-guided-value="trustClean" data-auth-guided-value="trustClean" data-guided-label="可信清爽" data-auth-guided-label="可信清爽"><i style="--design-accent:#2563eb"></i>可信清爽</button>
                    <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="designStyle" data-auth-guided-group="designStyle" data-guided-value="premiumCalm" data-auth-guided-value="premiumCalm" data-guided-label="高级克制" data-auth-guided-label="高级克制"><i style="--design-accent:#b7791f"></i>高级克制</button>
                    <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="designStyle" data-auth-guided-group="designStyle" data-guided-value="techSecure" data-auth-guided-value="techSecure" data-guided-label="科技安全" data-auth-guided-label="科技安全"><i style="--design-accent:#0f766e"></i>科技安全</button>
                    <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="designStyle" data-auth-guided-group="designStyle" data-guided-value="softFriendly" data-auth-guided-value="softFriendly" data-guided-label="亲和轻量" data-auth-guided-label="亲和轻量"><i style="--design-accent:#38bdf8"></i>亲和轻量</button>
                  </div>
                </section>

                <section class="guided-section guided-logo-section">
                  <div class="guided-section-head">
                    <span>品牌标识</span>
                    <strong>平台 Logo 摆放</strong>
                  </div>
                  <div class="guided-options logo-placement" data-guided-group="logoPlacement" data-auth-guided-group="logoPlacement">
                    <button class="active" type="button" data-guided-choice data-auth-guided-choice data-guided-group="logoPlacement" data-auth-guided-group="logoPlacement" data-guided-value="heroTopLeft" data-auth-guided-value="heroTopLeft" data-guided-label="品牌区左上" data-auth-guided-label="品牌区左上">品牌区左上</button>
                    <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="logoPlacement" data-auth-guided-group="logoPlacement" data-guided-value="topCenter" data-auth-guided-value="topCenter" data-guided-label="顶部居中" data-auth-guided-label="顶部居中">顶部居中</button>
                    <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="logoPlacement" data-auth-guided-group="logoPlacement" data-guided-value="formTop" data-auth-guided-value="formTop" data-guided-label="表单顶部" data-auth-guided-label="表单顶部">表单顶部</button>
                    <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="logoPlacement" data-auth-guided-group="logoPlacement" data-guided-value="mobileTop" data-auth-guided-value="mobileTop" data-guided-label="移动端优先" data-auth-guided-label="移动端优先">移动端优先</button>
                  </div>
                </section>

                <section class="guided-section">
                  <div class="guided-section-head">
                    <span>视觉主题</span>
                    <strong>品牌倾向</strong>
                  </div>
                  <div class="guided-field-block">
                    <label class="guided-field-label">主题颜色</label>
                    <div class="guided-options swatches" data-guided-group="theme" data-auth-guided-group="theme">
                      <button class="active" type="button" data-guided-choice data-auth-guided-choice data-guided-group="theme" data-auth-guided-group="theme" data-guided-value="blueTrust" data-auth-guided-value="blueTrust" data-guided-label="蓝色信任" data-auth-guided-label="蓝色信任"><i style="--swatch:#2563eb"></i>蓝色信任</button>
                      <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="theme" data-auth-guided-group="theme" data-guided-value="blackGold" data-auth-guided-value="blackGold" data-guided-label="黑金高净值" data-auth-guided-label="黑金高净值"><i style="--swatch:#b7791f"></i>黑金高净值</button>
                      <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="theme" data-auth-guided-group="theme" data-guided-value="emeraldSecure" data-auth-guided-value="emeraldSecure" data-guided-label="青绿安全" data-auth-guided-label="青绿安全"><i style="--swatch:#059669"></i>青绿安全</button>
                      <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="theme" data-auth-guided-group="theme" data-guided-value="graphiteSilver" data-auth-guided-value="graphiteSilver" data-guided-label="石墨银" data-auth-guided-label="石墨银"><i style="--swatch:#334155"></i>石墨银</button>
                      <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="theme" data-auth-guided-group="theme" data-guided-value="roseCampaign" data-auth-guided-value="roseCampaign" data-guided-label="玫红活动" data-auth-guided-label="玫红活动"><i style="--swatch:#e11d48"></i>玫红活动</button>
                    </div>
                    <div class="guided-freeform-field">
                      <label class="visually-hidden" for="authGuidedAccent">自定义品牌主色</label>
                      <input id="authGuidedAccent" data-auth-accent type="text" maxlength="32" value="#2563eb" placeholder="#2563EB" />
                    </div>
                  </div>
                </section>

                <section class="guided-section guided-tone-section">
                  <div class="guided-section-head">
                    <span>内容语气</span>
                    <strong>文案表达倾向</strong>
                  </div>
                  <div class="guided-options compact" data-guided-group="intent" data-auth-guided-group="intent">
                    <button class="active" type="button" data-guided-choice data-auth-guided-choice data-guided-group="intent" data-auth-guided-group="intent" data-guided-value="openAccount" data-auth-guided-value="openAccount" data-guided-label="开户链接" data-auth-guided-label="开户链接">开户链接</button>
                    <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="intent" data-auth-guided-group="intent" data-guided-value="secureLogin" data-auth-guided-value="secureLogin" data-guided-label="安全登录" data-auth-guided-label="安全登录">安全登录</button>
                    <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="intent" data-auth-guided-group="intent" data-guided-value="campaignSignup" data-auth-guided-value="campaignSignup" data-guided-label="活动转化" data-auth-guided-label="活动转化">活动转化</button>
                    <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="intent" data-auth-guided-group="intent" data-guided-value="partnerInvite" data-auth-guided-value="partnerInvite" data-guided-label="代理邀请" data-auth-guided-label="代理邀请">代理邀请</button>
                    <button type="button" data-guided-choice data-auth-guided-choice data-guided-group="intent" data-auth-guided-group="intent" data-guided-value="resetTrust" data-auth-guided-value="resetTrust" data-guided-label="找回信任" data-auth-guided-label="找回信任">找回信任</button>
                  </div>
                </section>
              </div>

              <aside class="guided-summary-panel">
                <div class="guided-section-head">
                  <span>选项汇总</span>
                  <strong data-auth-guided-summary-title>增长版方案</strong>
                </div>

                <div
                  class="guided-model-selector"
                  data-auth-model-summary
                  data-model-config-label="当前模型"
                  data-model-config-button="选择"
                  aria-label="引导式生成大模型选择"
                ></div>

                <div class="guided-summary-list" data-auth-guided-summary></div>

                <label class="guided-note-label" for="authGuidedIntentNote">补充要求</label>
                <textarea id="authGuidedIntentNote" data-auth-guided-note rows="4" placeholder="例如：移动端首屏先露出 Logo、手机号验证码和主按钮，投资背景放第二步。"></textarea>

                <div class="guided-actions">
                  <button class="guided-sync-button" type="button" data-auth-guided-sync>写入快速输入</button>
                  <button class="guided-generate-button" type="button" data-auth-guided-generate>生成预览</button>
                </div>
              </aside>
            </section>
          </div>
        </section>
      </div>

      <div class="client-toast" data-admin-toast hidden></div>
    </main>

    <script src="./common-layout.js"></script>
    <script src="./ai-model-settings.js"></script>
    <script src="./auth-personalization.js"></script>
    <script src="./auth-layout-admin.js?v=auth-flow-2"></script>
  </body>
</html>
