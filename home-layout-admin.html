<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./theme.js"></script>
    <title>ForexCRM - 首页 AI 生成</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./theme.css?v=tenant-home-4" />
    <link rel="stylesheet" href="./client-home.css?v=tenant-home-4" />
    <link rel="stylesheet" href="./home-personalization.css?v=tenant-home-4" />
  </head>
  <body data-layout-page="home-layout-admin">
    <main class="app" data-layout-main>
      <div class="page personalization-page">
        <section class="ai-intake-shell ai-chat-intake" data-ai-intake-page>
          <div class="ai-chat-center">
            <header class="ai-chat-hero">
              <span>ForexCRM AI</span>
              <h1>定制你的专属首页</h1>
            </header>

            <section class="ai-chat-composer" aria-label="AI 首页生成输入">
              <label class="visually-hidden" for="homeAiPrompt">描述首页目标</label>
              <textarea
                id="homeAiPrompt"
                data-ai-prompt
                rows="6"
                placeholder="描述客户类型、首屏重点、模块顺序或品牌感觉..."
              >帮我做成高净值客户风格，黑金色，首屏突出资产、入金和广告轮播图，交易账号列表放下方，整体更大气。</textarea>

              <div class="ai-chat-toolbar">
                <span class="ai-chat-status" data-config-status>等待输入</span>
                <div class="ai-chat-actions">
                  <button class="ai-tool-button" type="button" data-reset-config aria-label="恢复默认首页" title="恢复默认首页">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7" /><path d="M4 4v6h6" /></svg>
                  </button>
                  <button class="ai-tool-button text" type="button" data-model-config-open>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" /><path d="M4 12h2" /><path d="M18 12h2" /><path d="m6.3 6.3 1.4 1.4" /><path d="m16.3 16.3 1.4 1.4" /><path d="M12 4v2" /><path d="M12 18v2" /><path d="m17.7 6.3-1.4 1.4" /><path d="m7.7 16.3-1.4 1.4" /></svg>
                    <span>模型</span>
                  </button>
                  <button class="ai-send-button" type="button" data-generate-config aria-label="生成预览" title="生成预览">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5" /><path d="m5 12 7-7 7 7" /></svg>
                  </button>
                </div>
              </div>
            </section>

            <section class="ai-chat-suggestions" aria-label="AI 推荐首页方案">
              <div class="ai-suggestion-head">
                <span>AI 推荐</span>
                <strong>选择一个场景，自动生成可编辑文案</strong>
              </div>
              <button type="button" data-suggestion-prompt="高净值 VIP 客户首页，使用浅色高级金融风格，不要过黑；首屏突出总资产、钱包、入金出金和广告轮播图，右侧放 VIP 服务和开户动作，交易账号列表放到下方，整体大气但信息不空。">
                <b>高净值客户</b>
                <small>资产 Hero、VIP 服务、广告轮播、账号列表下置</small>
              </button>
              <button type="button" data-suggestion-prompt="专业交易客户首页，突出交易账号、MT5、持仓状态、账户余额、权益走势和常用操作；真实账号和模拟账号分成两个列表，整体信息密度更高，视觉像专业交易工作台。">
                <b>专业交易</b>
                <small>账号工作台、权益图表、MT5 快捷操作、双列表</small>
              </button>
              <button type="button" data-suggestion-prompt="新客户开户转化首页，首屏突出开户进度、KYC、首次入金和开真实账号、开模拟账号、绑定账号三个动作；模块要有明确下一步，不要信息太散。">
                <b>新客开户</b>
                <small>KYC 进度、开户表单、首次入金、下一步引导</small>
              </button>
              <button type="button" data-suggestion-prompt="活动增长首页，首屏突出交易大赛；欢迎模块独占第一栏但要轻量，广告轮播做成首屏核心并独占一整栏，快捷入口保留 8 个，整体扁平化、轻快清晰，色调淡金色。真实交易账号列表用卡片形式，并在真实账号分区提供创建真实交易账号按钮；模拟账号列表用列表形式。不要把开户做成右侧大面板。">
                <b>活动增长</b>
                <small>赛事 Banner、奖池曝光、8 个快捷入口、入金转化</small>
              </button>
              <button type="button" data-suggestion-prompt="IB 代理增长首页，突出开户链接、邀请码、二维码、注册点击和交易账号转化数据；广告和开户动作靠前，适合渠道经理日常跟进。">
                <b>代理增长</b>
                <small>邀请链接、二维码、转化数据、开户链接</small>
              </button>
              <button type="button" data-suggestion-prompt="资产管理首页，突出总资产、多币种钱包列表、入金出金、账户表现图表和交易账号列表；风格使用淡蓝色、扁平化、清爽专业。">
                <b>资产管理</b>
                <small>多币种钱包、资产概览、账户表现、资金操作</small>
              </button>
            </section>
          </div>
        </section>
      </div>

      <div class="client-toast" data-admin-toast hidden></div>
    </main>

    <script src="./common-layout.js"></script>
    <script src="./home-personalization.js"></script>
    <script src="./home-layout-admin.js"></script>
  </body>
</html>
