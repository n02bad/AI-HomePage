<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./theme.js"></script>
    <title>ForexCRM - 首页 AI 生成</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./theme.css?v=tenant-home-4" />
    <link rel="stylesheet" href="./client-home.css?v=tenant-home-4" />
    <link rel="stylesheet" href="./home-personalization.css?v=tenant-home-5" />
  </head>
  <body data-layout-page="home-layout-admin">
    <main class="app" data-layout-main>
      <div class="page personalization-page">
        <section class="ai-intake-shell ai-chat-intake" data-ai-intake-page>
          <div class="ai-chat-center">
            <header class="ai-chat-hero">
              <span>ForexCRM AI</span>
              <h1>定制你的专属首页</h1>
            </header>

            <div class="ai-generation-mode" role="tablist" aria-label="首页生成方式">
              <button class="active" type="button" role="tab" aria-selected="true" data-generation-mode-button="quick">AI 快速生成</button>
              <button type="button" role="tab" aria-selected="false" data-generation-mode-button="guided">引导式生成</button>
            </div>

            <section class="ai-render-mode-card" aria-label="首页预览渲染模式">
              <div>
                <span>生成模式</span>
                <strong>组件化 / AI HTML / 骨架填充</strong>
                <small data-render-mode-note>稳定模式：AI 输出配置，由首页组件和积木渲染。</small>
              </div>
              <div class="ai-render-mode-options" role="group" aria-label="选择生成模式">
                <button class="active" type="button" data-render-mode-button="config">组件化</button>
                <button type="button" data-render-mode-button="aiHtml">AI HTML</button>
                <button type="button" data-render-mode-button="skeletonHtml">骨架填充</button>
              </div>
            </section>

            <div class="ai-generation-panel active" data-generation-panel="quick">
              <section class="ai-chat-composer" aria-label="AI 首页生成输入">
                <label class="visually-hidden" for="homeAiPrompt">描述首页目标</label>
                <textarea
                  id="homeAiPrompt"
                  data-ai-prompt
                  rows="6"
                  placeholder="描述客户类型、首屏重点、模块顺序或品牌感觉..."
                >帮我做成高净值客户风格，黑金色，首屏突出资产、入金和广告轮播图，交易账号列表放下方，整体更大气。</textarea>

                <div class="ai-chat-toolbar">
                  <span class="ai-chat-status" data-config-status>等待输入</span>
                  <div class="ai-chat-actions">
                    <button class="ai-tool-button" type="button" data-reset-config aria-label="恢复默认首页" title="恢复默认首页">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7" /><path d="M4 4v6h6" /></svg>
                    </button>
                    <button class="ai-tool-button text" type="button" data-model-config-open>
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" /><path d="M4 12h2" /><path d="M18 12h2" /><path d="m6.3 6.3 1.4 1.4" /><path d="m16.3 16.3 1.4 1.4" /><path d="M12 4v2" /><path d="M12 18v2" /><path d="m17.7 6.3-1.4 1.4" /><path d="m7.7 16.3-1.4 1.4" /></svg>
                      <span>模型</span>
                    </button>
                    <button class="ai-send-button" type="button" data-generate-config aria-label="生成预览" title="生成预览">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5" /><path d="m5 12 7-7 7 7" /></svg>
                    </button>
                  </div>
                </div>
              </section>

              <section class="ai-chat-suggestions" aria-label="AI 推荐提示语案例" data-ai-suggestions>
                <div class="ai-suggestion-head">
                  <div>
                    <span>AI 推荐</span>
                    <strong data-suggestion-note>推荐可直接套用的首页提示语</strong>
                  </div>
                  <div class="ai-suggestion-tools">
                    <button class="ai-suggestion-tool" type="button" data-ai-generate-suggestions>生成提示语</button>
                    <button class="ai-suggestion-tool" type="button" data-refresh-suggestions>换一批</button>
                  </div>
                </div>
              </section>
            </div>

            <section class="ai-generation-panel guided-builder" data-generation-panel="guided" aria-label="引导式首页生成" hidden>
              <div class="guided-config">
                <section class="guided-section">
                  <div class="guided-section-head">
                    <span>功能分级</span>
                    <strong>控制模块复杂度</strong>
                  </div>
                  <div class="guided-options three" data-guided-group="level">
                    <button type="button" data-guided-choice data-guided-group="level" data-guided-value="basic" data-guided-label="基础版">基础版</button>
                    <button class="active" type="button" data-guided-choice data-guided-group="level" data-guided-value="growth" data-guided-label="增长版">增长版</button>
                    <button type="button" data-guided-choice data-guided-group="level" data-guided-value="pro" data-guided-label="专业版">专业版</button>
                  </div>
                </section>

                <section class="guided-section">
                  <div class="guided-section-head">
                    <span>页面模块</span>
                  </div>
                  <div class="guided-module-block">
                    <div class="guided-module-label">
                      <span>必选模块</span>
                      <small>生成首页时固定保留，不能撤销</small>
                    </div>
                    <div class="guided-options modules required" data-guided-group="modules" data-guided-module-tier="required">
                      <button class="active" type="button" data-guided-choice data-guided-multiple data-guided-required="true" data-guided-group="modules" data-guided-value="accountOverview" data-guided-label="账户概览" aria-disabled="true" title="必选模块，不可撤销">账户概览</button>
                      <button class="active" type="button" data-guided-choice data-guided-multiple data-guided-required="true" data-guided-group="modules" data-guided-value="quickActions" data-guided-label="快捷入口" aria-disabled="true" title="必选模块，不可撤销">快捷入口</button>
                      <button class="active" type="button" data-guided-choice data-guided-multiple data-guided-required="true" data-guided-group="modules" data-guided-value="tradingAccounts" data-guided-label="交易账号（真实交易账号/模拟交易账号）" aria-disabled="true" title="必选模块，不可撤销">交易账号</button>
                      <button class="active" type="button" data-guided-choice data-guided-multiple data-guided-required="true" data-guided-group="modules" data-guided-value="openingFlow" data-guided-label="新手引导（Onboarding：KYC→开真实账户→首次入金）" aria-disabled="true" title="必选模块，不可撤销">新手引导</button>
                    </div>
                  </div>
                  <div class="guided-module-block">
                    <div class="guided-module-label">
                      <span>选填模块</span>
                      <small>欢迎模块优先，其余模块按需要增减</small>
                    </div>
                    <div class="guided-options modules optional" data-guided-group="modules" data-guided-module-tier="optional">
                      <button class="active" type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="welcomeModule" data-guided-label="欢迎模块">欢迎模块</button>
                      <button class="active" type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="heroBanner" data-guided-label="首页 Banner / 广告轮播" title="按多张广告轮播图生成，支持自动切换和下一张">首页 Banner</button>
                      <button class="active" type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="accountBenefits" data-guided-label="账号表现">账号表现</button>
                      <button class="active" type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="kycGuide" data-guided-label="KYC 状态（未提交/待审/通过/拒绝）">KYC 状态</button>
                      <button type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="depositBonus" data-guided-label="入金奖励">入金奖励</button>
                      <button type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="rewardRules" data-guided-label="活动规则">活动规则</button>
                      <button type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="pammProducts" data-guided-label="PAMM">PAMM</button>
                      <button type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="copyTrading" data-guided-label="CopyTrading">CopyTrading</button>
                      <button type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="rewardActivity" data-guided-label="奖励活动">奖励活动</button>
                      <button type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="referralLink" data-guided-label="推广链接卡片（链接/邀请码/复制/基础统计）">推广链接卡片</button>
                      <button type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="appDownload" data-guided-label="APP 下载">APP 下载</button>
                      <button type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="customerService" data-guided-label="在线客服">在线客服</button>
                      <button type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="faq" data-guided-label="FAQ">FAQ</button>
                      <button type="button" data-guided-choice data-guided-multiple data-guided-group="modules" data-guided-value="riskDisclosure" data-guided-label="风险提示" title="无后台数据时会生成 Demo 参考风险提示文案">风险提示</button>
                    </div>
                  </div>
                </section>

                <section class="guided-section guided-design-section">
                  <div class="guided-section-head">
                    <span>设计风格</span>
                    <strong>界面感觉</strong>
                  </div>
                  <div class="guided-options design-style" data-guided-group="designStyle">
                    <button class="active" type="button" data-guided-choice data-guided-group="designStyle" data-guided-value="minimalClean" data-guided-label="简约留白"><i style="--design-accent:#64748b"></i>简约留白</button>
                    <button type="button" data-guided-choice data-guided-group="designStyle" data-guided-value="colorfulEnergy" data-guided-label="色彩活力"><i style="--design-accent:#ec4899"></i>色彩活力</button>
                    <button type="button" data-guided-choice data-guided-group="designStyle" data-guided-value="flatFresh" data-guided-label="扁平清爽"><i style="--design-accent:#14b8a6"></i>扁平清爽</button>
                    <button type="button" data-guided-choice data-guided-group="designStyle" data-guided-value="refinedPolish" data-guided-label="精致美观"><i style="--design-accent:#8b5cf6"></i>精致美观</button>
                  </div>
                </section>

                <section class="guided-section">
                  <div class="guided-section-head">
                    <span>视觉主题</span>
                    <strong>品牌倾向</strong>
                  </div>
                  <div class="guided-field-block">
                    <label class="guided-field-label">主题颜色</label>
                    <div class="guided-options swatches" data-guided-group="theme">
                      <button class="active" type="button" data-guided-choice data-guided-group="theme" data-guided-value="blueFinance" data-guided-label="蓝色金融"><i style="--swatch:#2563eb"></i>蓝色金融</button>
                      <button type="button" data-guided-choice data-guided-group="theme" data-guided-value="blackGold" data-guided-label="黑金高净值"><i style="--swatch:#b7791f"></i>黑金高净值</button>
                      <button type="button" data-guided-choice data-guided-group="theme" data-guided-value="lightGold" data-guided-label="浅金活动"><i style="--swatch:#d97706"></i>浅金活动</button>
                      <button type="button" data-guided-choice data-guided-group="theme" data-guided-value="minimalWhite" data-guided-label="极简白"><i style="--swatch:#94a3b8"></i>极简白</button>
                      <button type="button" data-guided-choice data-guided-group="theme" data-guided-value="darkTech" data-guided-label="暗色科技"><i style="--swatch:#111827"></i>暗色科技</button>
                      <button type="button" data-guided-choice data-guided-group="theme" data-guided-value="emeraldTrust" data-guided-label="翡翠信任"><i style="--swatch:#059669"></i>翡翠信任</button>
                      <button type="button" data-guided-choice data-guided-group="theme" data-guided-value="cobaltTeal" data-guided-label="钴蓝青绿"><i style="--swatch:#0f766e"></i>钴蓝青绿</button>
                      <button type="button" data-guided-choice data-guided-group="theme" data-guided-value="crimsonPromo" data-guided-label="赤红活动"><i style="--swatch:#be123c"></i>赤红活动</button>
                      <button type="button" data-guided-choice data-guided-group="theme" data-guided-value="graphiteSilver" data-guided-label="石墨银"><i style="--swatch:#334155"></i>石墨银</button>
                    </div>
                    <div class="guided-freeform-field">
                      <label class="visually-hidden" for="guidedThemeCustom">自定义色值或文案</label>
                      <input id="guidedThemeCustom" data-guided-theme-custom type="text" maxlength="96" placeholder="#2563EB / 品牌主色偏青蓝" />
                    </div>
                  </div>
                </section>

                <section class="guided-section guided-tone-section">
                  <div class="guided-section-head">
                    <span>内容语气</span>
                    <strong>文案表达倾向</strong>
                  </div>
                  <div class="guided-options compact" data-guided-group="tone">
                    <button class="active" type="button" data-guided-choice data-guided-group="tone" data-guided-value="professional" data-guided-label="专业稳健">专业稳健</button>
                    <button type="button" data-guided-choice data-guided-group="tone" data-guided-value="conversion" data-guided-label="营销转化">营销转化</button>
                    <button type="button" data-guided-choice data-guided-group="tone" data-guided-value="beginner" data-guided-label="新手友好">新手友好</button>
                    <button type="button" data-guided-choice data-guided-group="tone" data-guided-value="campaign" data-guided-label="活动促销">活动促销</button>
                    <button type="button" data-guided-choice data-guided-group="tone" data-guided-value="premium" data-guided-label="高净值导向">高净值导向</button>
                    <button type="button" data-guided-choice data-guided-group="tone" data-guided-value="ib" data-guided-label="代理招募导向">代理招募导向</button>
                  </div>
                </section>
              </div>

              <aside class="guided-summary-panel">
                <div class="guided-section-head">
                  <span>选项汇总</span>
                  <strong data-guided-summary-title>开户引导方案</strong>
                </div>

                <div
                  class="guided-model-selector"
                  data-model-config-summary
                  data-model-config-label="当前模型"
                  data-model-config-button="配置"
                  aria-label="引导式生成大模型选择"
                ></div>

                <div class="guided-summary-list" data-guided-summary></div>

                <label class="guided-note-label" for="guidedIntentNote">补充要求</label>
                <textarea id="guidedIntentNote" data-guided-note rows="4" placeholder="例如：突出 100 美元体验金，风格更像专业客户端。"></textarea>

                <div class="guided-actions">
                  <button class="guided-sync-button" type="button" data-guided-sync>写入快速输入</button>
                  <button class="guided-generate-button" type="button" data-guided-generate>生成预览</button>
                </div>
              </aside>
            </section>
          </div>
        </section>
      </div>

      <div class="client-toast" data-admin-toast hidden></div>
    </main>

    <script src="./common-layout.js"></script>
    <script src="./home-personalization.js"></script>
    <script src="./home-layout-admin.js"></script>
  </body>
</html>
